[build]
  command = "npm run build"
  publish = "dist"

[[redirects]]
  from = "/api/market-indices"
  to = "/.netlify/functions/market-indices"
  status = 200
  force = true

[[redirects]]
  from = "/api/route-optimizer-reference-prices"
  to = "/.netlify/functions/route-optimizer-reference-prices"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
